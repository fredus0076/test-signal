# SonarQube project identification
sonar.projectKey=test-signal
sonar.projectName=test-signal

# Default SonarQube URL (can be overridden via -Dsonar.host.url)
sonar.host.url=http://localhost:9000

# Source configuration
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Tests configuration
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts,**/node_modules/**,**/dist/**,**/coverage/**

# Coverage (Angular/Karma outputs LCOV here by default)
sonar.javascript.lcov.reportPaths=coverage/test-signal/lcov.info

# Optional: point SonarJS/TS analysis to your TS config
sonar.typescript.tsconfigPath=tsconfig.json
