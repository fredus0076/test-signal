
<h1>{{ 'hello' | transloco }}, {{ title() }}</h1>
<p>Congratulations! Your app is running. 🎉</p>
<!-- ici on doit ajouter {exect: true} pour indiquer que l'on souhaite que le bouton soit actif uniquement sur cette route 
     puisque on a un path: ""
     Sans exact: true, Angular considère qu’une route parente est active dès qu’une route enfant correspond.
Avec exact: true, Angular exige une correspondance stricte. -->
<button routerLink="/autre" routerLinkActive="active-route-blue" [routerLinkActiveOptions]="{ exact: true }" class="nav-button">Page Autre</button>
<button [routerLink]="['/autre', 123 ]" routerLinkActive="active-route-red" class="nav-button">Page Autre avec id</button>
<a class="nav-button" routerLink="/shop">Boutique</a>
<a class="nav-button" routerLink="/templating">Test Signal</a>
<a class="nav-button" routerLink="/error-test">Test Gestionnaire d'Erreurs</a>
<button (click)="toggleUserAuthentication()">Authentification</button>
<button (click)="testErrorHandler()" class="error-test-button">Test Error Handler</button>

<router-outlet />
