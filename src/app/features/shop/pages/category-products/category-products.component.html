<section class="category-products" data-testid="category-products-root">
  <h1 data-testid="category-products-title">Produits de la catégorie</h1>
  <p data-testid="category-products-category">Catégorie : <strong>{{ category }}</strong></p>

  <form class="filters" [formGroup]="form" data-testid="category-products-filters-form">
    <app-category-search-control formControlName="search" />
  </form>

  <p class="debug" data-testid="category-products-debug">
    Valeur du contrôle : <strong>{{ form.value.search }}</strong>
  </p>

  <p>
    Remplace ce template par une liste de produits filtrés sur la catégorie.
  </p>
</section>
