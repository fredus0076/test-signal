<div class="search-control" data-testid="category-search-control-root">
  <label class="label" for="category-search">Recherche</label>

  <div class="input-row">
    <input
      id="category-search"
      data-testid="category-search-control-input"
      class="input"
      type="text"
      [value]="value"
      [disabled]="disabled"
      placeholder="Ex: chemise, chaussure…"
      (input)="onInput(($any($event.target).value))"
      (blur)="onBlur()"
    />

    <button data-testid="category-search-control-clear" type="button" class="clear" (click)="clear()" [disabled]="disabled || !value">
      Effacer
    </button>
  </div>
</div>
